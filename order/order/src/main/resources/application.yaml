spring:
  application:
    name: order
  datasource:
    url: jdbc:mysql://localhost:3306/smartECommerce
    username: root
    password: root123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true    
server:
  port: 8082

jwt:
  secret: your_super_secret_key123456789987654321

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2

      notificationService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2